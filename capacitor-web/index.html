<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Smith-Heffa Paygate</title>
    <meta
      http-equiv="refresh"
      content="0; url=https://smith-heffa-paygate.ca/dashboard"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fffaf2;
        color: #2f2416;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 182, 39, 0.22), transparent 45%),
          linear-gradient(180deg, #fffaf2 0%, #fff3db 100%);
      }

      main {
        width: min(92vw, 28rem);
        padding: 2rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 60px rgba(83, 48, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 1rem;
        line-height: 1.5;
      }

      a {
        color: #8b3d00;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Smith-Heffa Paygate</h1>
      <p>Opening the secure mobile payment workspace…</p>
      <p>
        If the app does not continue automatically,
        <a href="https://smith-heffa-paygate.ca/dashboard">open the dashboard</a>.
      </p>
    </main>
  </body>
</html>
